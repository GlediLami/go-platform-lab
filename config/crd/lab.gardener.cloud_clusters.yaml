# Hand-written CRD for the lab Cluster type. In real projects this file is
# generated from the Go types with controller-gen (make generate in Gardener).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.lab.gardener.cloud
spec:
  group: lab.gardener.cloud
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
    shortNames:
    - lc
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Version
      type: string
      jsonPath: .spec.version
    - name: Hibernated
      type: boolean
      jsonPath: .spec.hibernated
    - name: Replicas
      type: integer
      jsonPath: .status.replicas
    - name: Valid
      type: string
      jsonPath: .status.conditions[?(@.type=="SpecValid")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - version
            properties:
              version:
                type: string
              hibernated:
                type: boolean
              workers:
                type: array
                items:
                  type: object
                  required:
                  - name
                  - minimum
                  - maximum
                  properties:
                    name:
                      type: string
                    minimum:
                      type: integer
                      format: int32
                    maximum:
                      type: integer
                      format: int32
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
